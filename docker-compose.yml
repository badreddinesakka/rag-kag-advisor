# =============================================================================
# Les deux bases du projet : Milvus (RAG) et Neo4j (KAG)
# =============================================================================
# Ce fichier a été reconstruit à partir des conteneurs réellement en service :
# mêmes images, mêmes versions, mêmes ports. Deux écarts volontaires, expliqués
# à leur ligne — les volumes et le mot de passe.
#
#   docker compose up -d      démarrer
#   docker compose ps         vérifier
#   docker compose down       arrêter (les données restent)
#   docker compose down -v    arrêter ET tout effacer
#
# Milvus a besoin de trois conteneurs : lui-même, etcd pour ses métadonnées,
# MinIO pour ses fichiers. C'est le déploiement « standalone » officiel, pas
# une complication de ce projet.
# =============================================================================

services:

  # --- Neo4j : le graphe de connaissances, côté KAG --------------------------
  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      # LE MOT DE PASSE N'EST PAS ÉCRIT ICI.
      # Il est lu dans le fichier .env, qui n'est pas versionné. Un mot de
      # passe en clair dans un dépôt public est un mot de passe compromis —
      # et celui-ci ouvre l'accès à tout le graphe.
      #
      # Créez un fichier .env à côté de ce fichier :
      #     NEO4J_PASSWORD=votre_mot_de_passe
      #
      # Le même mot de passe doit être connu des scripts Python :
      #     $env:NEO4J_PASSWORD = "votre_mot_de_passe"
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?definissez NEO4J_PASSWORD dans un fichier .env}
    ports:
      - "7474:7474"   # interface web : http://localhost:7474
      - "7687:7687"   # protocole bolt, utilisé par les scripts
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped


  # --- etcd : les métadonnées de Milvus -------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://etcd:2379
           -listen-client-urls http://0.0.0.0:2379
           --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    # Aucun port publié : seul Milvus lui parle, depuis le réseau interne.
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped


  # --- MinIO : le stockage de fichiers de Milvus ----------------------------
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: milvus-minio
    environment:
      # Identifiants par défaut de Milvus. Ils ne protègent rien d'exposé :
      # MinIO n'est joignable que depuis la machine locale. À changer si vous
      # publiez ces ports sur un réseau.
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # console web : http://localhost:9001
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped


  # --- Milvus : la base vectorielle, côté RAG -------------------------------
  milvus:
    image: milvusdb/milvus:v2.6.19
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    ports:
      - "19530:19530"   # port utilisé par pymilvus
      - "9091:9091"     # métriques et santé
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    restart: unless-stopped


# =============================================================================
# VOLUMES
# =============================================================================
# Les conteneurs d'origine écrivaient dans C:\milvus\volumes\, un chemin absolu
# propre à une machine Windows. Ici, Docker gère les volumes lui-même : le
# fichier fonctionne sur Windows, Linux et macOS sans être modifié.
#
# Les données survivent à « docker compose down ». Pour repartir de zéro :
#     docker compose down -v
# =============================================================================
volumes:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
